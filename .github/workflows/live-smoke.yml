name: Live Comet Smoke

on:
  workflow_dispatch:
    inputs:
      comet-host:
        description: "Comet host/IP reachable from the comet-lan runner"
        default: "192.168.0.126"
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-smoke:
    name: Read-only live Comet smoke
    runs-on: [self-hosted, comet-lan]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Install dependencies from lockfile
        run: uv sync --frozen --group dev

      - name: Run read-only live smoke
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          COMET_HOST: ${{ inputs.comet-host }}
          RUN_LIVE_COMET_SMOKE: "1"
        run: uv run --locked --python 3.13 pytest tests/live/test_live_smoke.py -q
