name: Live Comet Smoke

on:
  workflow_dispatch:
    inputs:
      comet-host:
        description: "Comet host/IP reachable from the comet-lan runner"
        default: "192.168.0.126"
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-smoke:
    name: Read-only live Comet smoke
    runs-on: [self-hosted, comet-lan]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Install dependencies from lockfile
        run: uv sync --frozen --group dev

      - name: Run read-only live smoke
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          COMET_HOST: ${{ inputs.comet-host }}
          RUN_LIVE_COMET_SMOKE: "1"
        run: uv run --locked --python 3.13 pytest tests/live/test_live_smoke.py -q
